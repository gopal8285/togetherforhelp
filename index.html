    <!-- GitHub Pages SPA redirect handshake: decodes the path 404.html
         encoded into the query string, and restores the real URL before
         React Router mounts, so a hard refresh / direct link on any
         route (e.g. /donate) works instead of showing a 404. -->
    <script>
      (function () {
        var redirect = sessionStorage.redirect;
        delete sessionStorage.redirect;
        if (redirect && redirect !== location.href) {
          history.replaceState(null, null, redirect);
        }
      })();
    </script>
